name: marqflow
description: A lightweight Flutter text marquee for automatically scrolling overflowing and localized text.
version: 0.1.3
homepage: https://github.com/Vishnu0074/marqflow
repository: https://github.com/Vishnu0074/marqflow
issue_tracker: https://github.com/Vishnu0074/marqflow/issues
topics:
  - marquee
  - text
  - scrolling
  - localization
  - internationalization

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
